[package]
name = "asset-bot"
version = "0.1.0"
edition = "2024"
description = "Discord bot that compares EVE Online assets with the stock you want at a location and writes the shopping list"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
dotenvy = "0.15.7"
jsonwebtoken = { version = "12.0.0", features = ["aws_lc_rs"] }
rand = "0.10.4"
reqwest = { version = "0.13.5", features = ["form", "gzip", "json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
serenity = { version = "0.12.5", default-features = false, features = ["client", "gateway", "model", "rustls_backend"] }
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "sqlite"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
